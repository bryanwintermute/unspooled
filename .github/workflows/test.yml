name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Opt into Node.js 24 for any actions that still default to 20 internally.
# (Belt-and-suspenders alongside the @v6 majors below; harmless once everything
# we depend on is fully on Node 24.)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest (the only dev dependency)
        run: python -m pip install --quiet pytest
      - name: Run byte-equality regression suite
        run: python -m pytest tests/ -v
